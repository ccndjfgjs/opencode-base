[build-system]
requires = ["setuptools>=68.0", "wheel"]
build-backend = "setuptools.backends._legacy:_Backend"

[project]
name = "mcp-ldplayer"
version = "1.0.0"
description = "MCP Server for Android Pentesting via LDPlayer Emulator"
readme = "README.md"
license = {text = "MIT"}
requires-python = ">=3.10"
authors = [
    {name = "ThiagoFrag", email = "thiagofrag@users.noreply.github.com"}
]
keywords = [
    "mcp", "ldplayer", "android", "pentest", "security",
    "emulator", "adb", "frida", "mobile-security"
]
classifiers = [
    "Development Status :: 4 - Beta",
    "Intended Audience :: Developers",
    "Intended Audience :: Information Technology",
    "License :: OSI Approved :: MIT License",
    "Operating System :: Microsoft :: Windows",
    "Programming Language :: Python :: 3",
    "Programming Language :: Python :: 3.10",
    "Programming Language :: Python :: 3.11",
    "Programming Language :: Python :: 3.12",
    "Programming Language :: Python :: 3.13",
    "Topic :: Security",
    "Topic :: Software Development :: Testing",
]

[project.urls]
Homepage = "https://github.com/ThiagoFrag/mcp-ldplayer"
Repository = "https://github.com/ThiagoFrag/mcp-ldplayer"
Issues = "https://github.com/ThiagoFrag/mcp-ldplayer/issues"

[project.scripts]
mcp-ldplayer = "mcp_ldplayer.mcp_server:main"

[tool.setuptools.packages.find]
include = ["mcp_ldplayer*"]

[tool.pytest.ini_options]
testpaths = ["tests"]
python_files = ["test_*.py"]
python_classes = ["Test*"]
python_functions = ["test_*"]
addopts = "-v --tb=short"
